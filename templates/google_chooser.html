<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f0f4f9;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-[450px] w-full bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-gray-100">
        <!-- Google Logo -->
        <div class="flex justify-center mb-5">
            <svg class="w-10 h-10" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-2xl font-medium text-gray-900">Sign in with Google</h1>
            <p class="text-sm text-gray-600 mt-1">to continue to <strong class="text-emerald-800 font-bold">Vamsi Organic Farms</strong></p>
        </div>

        <!-- Pre-configured Google Accounts for 1-Click Sign-In -->
        <div class="space-y-2 border-t border-b border-gray-200 py-3 mb-5">
            <!-- Account 1 -->
            <form action="/auth/google/demo" method="POST">
                <input type="hidden" name="email" value="vamsi.google@gmail.com">
                <input type="hidden" name="name" value="Vamsi Krishna">
                <button type="submit" class="w-full flex items-center p-3 rounded-2xl hover:bg-gray-50 transition border border-transparent hover:border-gray-200 group text-left">
                    <div class="w-10 h-10 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-base shadow-sm mr-3">
                        V
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-gray-900 text-sm truncate">Vamsi Krishna</div>
                        <div class="text-xs text-gray-500 truncate">vamsi.google@gmail.com</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-emerald-600 text-xs transition"></i>
                </button>
            </form>

            <!-- Account 2 -->
            <form action="/auth/google/demo" method="POST">
                <input type="hidden" name="email" value="fresh.family@gmail.com">
                <input type="hidden" name="name" value="Fresh Family Kitchen">
                <button type="submit" class="w-full flex items-center p-3 rounded-2xl hover:bg-gray-50 transition border border-transparent hover:border-gray-200 group text-left">
                    <div class="w-10 h-10 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-base shadow-sm mr-3">
                        F
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-gray-900 text-sm truncate">Fresh Family Kitchen</div>
                        <div class="text-xs text-gray-500 truncate">fresh.family@gmail.com</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-emerald-600 text-xs transition"></i>
                </button>
            </form>

            <!-- Custom Account Toggle -->
            <button type="button" onclick="toggleCustomGoogleInput()" class="w-full flex items-center p-3 rounded-2xl hover:bg-gray-50 transition border border-transparent hover:border-gray-200 group text-left">
                <div class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center text-sm mr-3">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <div class="font-medium text-gray-700 text-sm">Use another Google account</div>
            </button>
        </div>

        <!-- Custom Account Form (Hidden by default) -->
        <div id="custom-google-form" class="hidden mb-5 bg-gray-50 p-4 rounded-2xl border border-gray-200 space-y-3">
            <form action="/auth/google/demo" method="POST" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Your Name</label>
                    <input type="text" name="name" placeholder="e.g. Ramesh Kumar" required
                           class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Google Email Address</label>
                    <input type="email" name="email" placeholder="ramesh@gmail.com" required
                           class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-[#1a73e8] hover:bg-[#1557b0] text-white text-xs font-bold py-2.5 rounded-xl transition shadow-xs">
                    Continue to Vamsi Farms
                </button>
            </form>
        </div>

        <!-- Google Disclosure Notice -->
        <p class="text-[11px] text-gray-500 leading-relaxed text-center mb-6">
            To continue, Google will securely share your name, email address, and language preference with Vamsi Organic Farms.
        </p>

        <!-- Actions -->
        <div class="flex items-center justify-between text-xs font-medium">
            <a href="/login" class="text-gray-600 hover:text-gray-900 transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>Cancel</span>
            </a>
            <span class="text-gray-400">OAuth 2.0 Protected</span>
        </div>
    </div>

    <script>
        function toggleCustomGoogleInput() {
            const form = document.getElementById('custom-google-form');
            if (form) {
                form.classList.toggle('hidden');
            }
        }
    </script>
</body>
</html>
